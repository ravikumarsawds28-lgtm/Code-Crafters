services:
  - type: web
    name: fitness-log-web
    env: node
    plan: free
    buildCommand: npm install --prefix backend && npm install --prefix frontend && npm run build --prefix frontend && npm run migrate --prefix backend
    startCommand: node backend/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fitness-log-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: fitness-log-db
    plan: free
    databaseName: fitness_log
